apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: python:3.9-slim
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        if [ -d "$WORKSPACE_SOURCE_PATH" ]; then
          find "$WORKSPACE_SOURCE_PATH" \
            -mindepth 1 -maxdepth 1 \
            -exec rm -rf {} +
        fi
        echo "Cleanup completed"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install Flask requests nose
        nosetests -v test_emotion_detection.py
