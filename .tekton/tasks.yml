
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: cleanup
      image: python:3.11-slim
      script: |
        #!/bin/sh
        set -eu
        find "$(workspaces.source.path)" \
          -type d -name __pycache__ \
          -prune -exec rm -rf {} +
        echo "Cleanup completed"

---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: test
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m pip install Flask requests
        python -m unittest -v test_emotion_detection.py
